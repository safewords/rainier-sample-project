[package]
name = "app"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "A Rainier application."

[dependencies]
# The framework. `sea-orm-executor` gives the native MySQL / Postgres / SQLite
# driver; drop it and add `d1-http` to target a Cloudflare Worker instead.
rainier-framework = { git = "https://github.com/safewords/rainier-framework.git", features = [
    "sea-orm-executor",
] }

# Cache and session drivers are opt-in, so a build only compiles the clients it
# needs. Add "redis", "redis-cluster" or "memcached" to the features above to
# make CACHE_DRIVER / SESSION_DRIVER=cache able to select them.

# `#[derive(Entity)]` expands to `::rainier_orm::…`, an absolute path, so any
# crate defining a model needs Rainier ORM as a direct dependency — the
# framework's re-export is not enough to satisfy it.
rainier-orm = { git = "https://github.com/safewords/rainier-framework.git" }

async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"

# Cache and session drivers. Enable one to make CACHE_DRIVER able to select it;
# without the feature, the driver falls back to memory with a warning rather
# than failing, because a cache is the one dependency an app should be able to
# lose.
[features]
default = []
redis = ["rainier-framework/redis"]
redis-cluster = ["redis", "rainier-framework/redis-cluster"]
memcached = ["rainier-framework/memcached"]

# Mail senders, one per destination — without one, MAIL_DRIVER can still be
# log, file or memory, and selecting a sender fails the boot naming the
# feature it needs. `mail-smtp` pairs with the Mailpit container for
# development; see `config/mail.rs`.
mail-smtp = ["rainier-framework/mail-smtp"]
mail-ses = ["rainier-framework/mail-ses"]
mail-postmark = ["rainier-framework/mail-postmark"]
mail-mailgun = ["rainier-framework/mail-mailgun"]
mail-sendgrid = ["rainier-framework/mail-sendgrid"]
mail-resend = ["rainier-framework/mail-resend"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# One `app` library plus one `app` binary: the binary is the console entry
# point, and the library is what the tests boot.
[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"
