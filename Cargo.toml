[package]
name = "app"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false
description = "A Rainier application."

[dependencies]
# The framework. `sea-orm-executor` gives the native MySQL / Postgres / SQLite
# driver; drop it and add `d1-http` to target a Cloudflare Worker instead.
rainier-framework = { git = "https://github.com/safewords/rainier-framework.git", features = [
    "sea-orm-executor",
] }

# Cache and session drivers are opt-in, so a build only compiles the clients it
# needs. Add "redis", "redis-cluster" or "memcached" to the features above to
# make the matching store in `config/cache.rs` buildable.

# `#[derive(Entity)]` expands to `::rainier_orm::…`, an absolute path, so any
# crate defining a model needs Rainier ORM as a direct dependency — the
# framework's re-export is not enough to satisfy it.
rainier-orm = { git = "https://github.com/safewords/rainier-framework.git" }

async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"

# Cache and session drivers. Enable one to make the matching store in
# `config/cache.rs` buildable; a store naming a driver this build does not carry
# is a **boot failure**, not a fallback.
#
# That is the opposite of what this comment used to say, and the reversal is
# deliberate. "A cache is the one dependency an app should be able to lose" is
# true of cached values and false of everything else the store carries: falling
# back to an in-process cache gives you locks that hold within one replica,
# a rate limiter that counts to its limit once per replica, and a session store
# that signs people out as the load balancer moves them. None of it reports
# anything.
[features]
default = []
redis = ["rainier-framework/redis"]
redis-cluster = ["redis", "rainier-framework/redis-cluster"]
memcached = ["rainier-framework/memcached"]

# Queue drivers beyond sync/memory/database (which need nothing).
sqs = ["rainier-framework/sqs"]
kafka = ["rainier-framework/kafka"]
kafka-tls = ["kafka", "rainier-framework/kafka-tls"]

# File storage on S3 and everything that speaks its API - R2, MinIO, B2.
s3 = ["rainier-framework/s3"]

# The bcrypt hash driver: HASH_DRIVER=bcrypt, and reading a `$2y$` table a
# PHP application left behind. Without it argon2id is the whole set.
bcrypt = ["rainier-framework/bcrypt"]

# API-gating features: these compile framework surface your code can then
# reach for - they wire nothing by themselves.
# RS256/ES256 tokens and a JWKS document.
jwt = ["rainier-framework/jwt"]
# A real transport behind the `Http` facade (the client API and its fake are
# always there; only the socket costs a TLS stack).
http-client = ["rainier-framework/http-client"]

# Mail senders, one per destination — without one, MAIL_DRIVER can still be
# log, file or memory, and selecting a sender fails the boot naming the
# feature it needs. `mail-smtp` pairs with the Mailpit container for
# development; see `config/mail.rs`.
mail-smtp = ["rainier-framework/mail-smtp"]
mail-ses = ["rainier-framework/mail-ses"]
mail-postmark = ["rainier-framework/mail-postmark"]
mail-mailgun = ["rainier-framework/mail-mailgun"]
mail-sendgrid = ["rainier-framework/mail-sendgrid"]
mail-resend = ["rainier-framework/mail-resend"]

# --- add-ins ----------------------------------------------------------------
#
# Off by default, each one: a default build compiles none of the code behind
# them, and the README's "Add-ins" section lists the routes each one mounts.
# Their tables are created in every build regardless — see
# `database/migrations` — so turning one on is never a schema change.
#
# Everything below `accounts` builds on it: the browser session and the `web`
# guard it introduces are what checkout, sign-in with GitHub, the consent
# screen and impersonation all hang off.

# Registration, login with lockout, password reset, email verification and
# password confirmation, mounted under `/account`. Brings the `web` session
# guard, CSRF on browser routes, and impersonation for admins.
accounts = ["rainier-framework/accounts"]
# TOTP with recovery codes, and the challenge after a right password.
two-factor = ["accounts", "rainier-framework/two-factor"]
# WebAuthn passkeys — registration and passwordless sign-in.
passkeys = ["accounts", "rainier-framework/passkeys"]
# "Sign in with GitHub", and any OpenID Connect issuer.
sso = ["accounts", "rainier-framework/sso"]
# Stripe Checkout, the billing portal, and verified webhooks that keep a local
# copy of each subscription.
billing-stripe = ["accounts", "rainier-framework/billing-stripe"]
# An OAuth 2.0 server: `/oauth/token`, a consent screen, and API routes that
# accept the tokens it issues.
oauth-server = ["accounts", "rainier-framework/oauth-server"]
# A span for every request, query, cache call, job and mail, and queue
# metrics — configured entirely by `TELEMETRY_ENABLED` and `OTEL_*`.
telemetry = ["rainier-framework/telemetry"]
# A human check on registration.
captcha = ["accounts", "rainier-framework/captcha"]
# Published posts announced in a Discord channel.
notify-discord = ["rainier-framework/notify-discord"]
# Running beside a PHP application during a migration: its sessions and CSRF
# tokens accepted here. Not part of `add-ins` — it is for one situation.
compat-php = ["accounts", "rainier-framework/compat-php"]

# Every add-in except `compat-php`.
add-ins = [
    "accounts",
    "two-factor",
    "passkeys",
    "sso",
    "billing-stripe",
    "oauth-server",
    "telemetry",
    "captcha",
    "notify-discord",
]

# RSA key generation is the slow part of booting with `oauth-server` and no
# `OAUTH_PRIVATE_KEY` — every feature test boots an application, and an
# unoptimised big-integer library makes each one wait seconds. Optimising just
# these two keeps the rest of the debug build debuggable.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# One `app` library plus one `app` binary: the binary is the console entry
# point, and the library is what the tests boot.
[lib]
name = "app"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/main.rs"
